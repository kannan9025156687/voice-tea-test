<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>குரல் டீ ஆர்டர்</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:system-ui,"Noto Sans Tamil",sans-serif;background:#3b1f10;color:#fff8ec;text-align:center}
#app{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;padding-bottom:20px!important;display:flex;flex-direction:column;padding:12px;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:700}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:1.2vh;overflow-y:auto;overflow-x:hidden;width:100%}
#big{font-size:min(12vw,9vh);font-weight:800;line-height:1.35;color:#ffd166;white-space:pre-line}
#big.bill{font-size:min(6.4vw,5vh);line-height:1.6}
#sub{font-size:min(5.5vw,3.5vh);white-space:pre-line}
#qr{display:none;background:#fff;padding:12px;border-radius:12px}
#qr{padding:8px}
#qr img,#qr canvas{width:min(62vw,25vh)!important;height:min(62vw,25vh)!important}
#note{font-size:13px;opacity:.95;line-height:1.35;padding:0 6px}
#heard{min-height:1.4em;opacity:.7;font-size:14px}
footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:12px;padding:11px 14px;font:700 17px inherit;background:#ffd166;color:#3b1f10}
button.alt{background:#6b4330;color:#fff}
.hbtns{display:flex;gap:8px}
#mute{font-size:14px}
button.ok{background:#2e9e55;color:#fff}
[hidden]{display:none!important}
#hist{position:fixed;inset:0;background:#3b1f10;display:flex;flex-direction:column;gap:8px;padding:12px;text-align:left;overflow-y:auto;-webkit-overflow-scrolling:touch}
#hist .hh{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:18px}
#sum{white-space:pre-line;font-size:17px;line-height:1.6;background:#4d2c1a;border-radius:12px;padding:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;border-bottom:1px solid #6b4330;padding:5px 0}
.row span{flex:1;min-width:60%}
.row button{padding:6px 10px;font-size:14px}
.bk{display:flex;gap:8px;flex-wrap:wrap}
.bk button{font-size:15px;padding:9px 12px}
#adds{scrollbar-width:none;display:flex;gap:8px;overflow-x:auto;justify-content:safe center;padding:2px 0;flex-shrink:0}
#adds::-webkit-scrollbar{display:none}
#adds button{white-space:nowrap;flex-shrink:0}
#chips{display:flex;gap:8px;justify-content:center;flex-shrink:0}
#chips button{font-size:15px;padding:8px 12px}
#chips button.on{background:#ffd166;color:#3b1f10}
#setup{overflow-y:auto;justify-content:safe center}
.irow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#4d2c1a;border-radius:10px;padding:8px}
.irow input{flex:1;min-width:30%}
.irow .x{flex:0 0 auto}
#sErr{color:#ffb4a2;font-size:14px;white-space:pre-line}
.pre{display:flex;gap:6px;flex-wrap:wrap}
.pre button{font-size:14px;padding:7px 10px}
button.hot{outline:3px solid #ffd166}
.row.fixing{background:#4d2c1a;border-radius:8px;padding:8px 6px}
#bkNote{font-size:13px;opacity:.85;white-space:pre-line}
#setup{position:fixed;inset:0;background:#3b1f10;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px}
#setup input{padding:10px;border-radius:8px;border:0;font-size:16px;width:100%}
#setup label{text-align:left;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header><span id="shop"></span><span class="hbtns"><button class="alt" id="book" aria-label="கணக்கு">📒</button><button class="alt" id="mute" aria-label="குரல் பதில்">🔊 குரல்</button><button class="alt" id="gear" aria-label="அமைப்புகள்">⚙️</button></span></header>
  <main>
    <div id="big"></div>
    <div id="qr"></div>
    <div id="sub"></div>
    <div id="note" hidden>"பணம் வந்தது ✔" என்பது கடைக்காரரின் உறுதிப்படுத்தல் மட்டுமே; bank verification அல்ல.</div>
  </main>
  <div id="chips" hidden><button class="alt" id="nLs">சர்க்கரை குறைவு</button><button class="alt" id="nPc">பார்சல்</button></div>
  <div id="adds"></div>
  <div id="heard"></div>
  <footer>
    <button id="start">🎤 தொடங்கு</button>
    <button class="ok" id="confirm" hidden>✔ உறுதி</button>
    <button class="ok" id="paid" hidden>கடைக்காரர்: UPI பணம் வந்தது ✔</button>
    <button class="ok" id="cash" hidden>💵 Cash வந்தது ✔</button>
    <button class="alt" id="cancel" hidden>✖ ரத்து</button>
  </footer>
</div>

<div id="hist" hidden>
  <div class="hh"><button class="alt" id="dPrev">◀</button><b id="dLbl"></b><button class="alt" id="dNext">▶</button><button class="alt" id="hClose">✖ மூடு</button></div>
  <button class="ok" id="bShare">📤 இன்றைய கணக்கைப் பகிர்</button>
  <div id="sum"></div>
  <div id="rows"></div>
  <div class="bk">
    <button id="bJson">⬇ Backup (JSON)</button>
    <button class="alt" id="bCsv">⬇ CSV</button>
    <button class="alt" id="bRestore">⬆ Restore</button>
    <button class="alt" id="bShareBk" hidden>📤 Backup பகிர்</button>
  </div>
  <div id="bkNote"></div>
  <input type="file" id="bFile" accept=".json,application/json" hidden>
</div>

<form id="setup" hidden>
  <h2>கடை அமைப்புகள்</h2>
  <label>கடை பெயர்<input id="sName" required></label>
  <label>UPI ID<input id="sUpi" required placeholder="name@bank" pattern="[A-Za-z0-9._\-]+@[A-Za-z0-9.\-]+" autocapitalize="off"></label>
  <label>டீ விலை ₹<input id="sTea" type="number" min="1" required></label>
  <label>காபி விலை ₹<input id="sCoffee" type="number" min="1" required></label>
  <div id="sItemsH" style="text-align:left;font-size:14px">கூடுதல் பொருட்கள் (விலை நீங்களே உள்ளிடவும்)</div>
  <div id="sItems"></div>
  <div class="pre"><button type="button" class="alt" data-pre="பிளாக் டீ|பிளாக் டீ, பிளாக்டீ, பிளாக், black tea">+ பிளாக் டீ</button><button type="button" class="alt" data-pre="பன்|பன், bun">+ பன்</button><button type="button" class="alt" data-pre="பிஸ்கட்|பிஸ்கட், பிஸ்கெட், biscuit">+ பிஸ்கட்</button><button type="button" class="alt" data-pre="|">+ புதிய பொருள்</button></div>
  <div id="sErr"></div>
  <button>சேமி</button>
  <button type="button" class="alt" id="sCancel">மூடு</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'voiceTeaCfg';
const NAMES = {tea:'டீ', coffee:'காபி'};
let cfg = {name:'எங்கள் டீ கடை', upi:'', tea:15, coffee:20, items:[]};
try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
// கூடுதல் பொருட்கள்: பழைய settings-ல் items இல்லை; தவறான பதிவுகள் தவிர்க்கப்படும்
const okItem = i => i && typeof i.id === 'string' && /^x[a-z0-9]+$/.test(i.id) && typeof i.name === 'string' && i.name.length > 0 && i.name.length <= 20 &&
  Number.isSafeInteger(i.price) && i.price >= 1 && Array.isArray(i.aliases) && i.aliases.every(a => typeof a === 'string' && a);
cfg.items = Array.isArray(cfg.items) ? cfg.items.filter(okItem).slice(0, 12) : [];
const KEYS = () => ['tea', 'coffee', ...cfg.items.map(i => i.id)];
const blank = () => Object.fromEntries(KEYS().map(k => [k, 0]));
const nameOf = k => NAMES[k] || (cfg.items.find(i => i.id === k) || {name:k}).name;
const priceOf = k => k === 'tea' ? cfg.tea : k === 'coffee' ? cfg.coffee : (cfg.items.find(i => i.id === k) || {price:0}).price;
const anyItem = o => KEYS().some(k => o[k]);

let state = 'idle', order = {tea:0, coffee:0}, resetTimer, cur = null, notes = {ls:false, pc:false};

/* ---------- கணக்குப் பதிவு (இந்த போனில் மட்டும்) ---------- */
const LKEY = 'voiceTeaLog', BKEY = 'voiceTeaBackup';
let log = [], storeErr = false;
try { const a = JSON.parse(localStorage.getItem(LKEY) || '[]'); if (Array.isArray(a)) log = a.filter(okRec); } catch(e) {}
function okRec(r){
  return r && typeof r.id === 'string' && Number.isFinite(r.ts) &&
    Number.isSafeInteger(r.tea) && r.tea >= 0 && Number.isSafeInteger(r.coffee) && r.coffee >= 0 &&
    Number.isSafeInteger(r.amt) && r.amt >= 0 &&
    ['pending','received','cancelled'].includes(r.status) &&
    (r.status === 'received' ? ['cash','upi'].includes(r.method) : !r.method) &&
    (r.fix === undefined || (r.fix && ['cash','upi'].includes(r.fix.from) && Number.isFinite(r.fix.at))) &&
    (r.x === undefined || (Array.isArray(r.x) && r.x.length <= 20 && r.x.every(e => e && typeof e.id === 'string' && typeof e.name === 'string' && e.name.length <= 40 && Number.isSafeInteger(e.price) && e.price >= 0 && Number.isSafeInteger(e.qty) && e.qty > 0))) &&
    (r.n === undefined || (r.n && typeof r.n === 'object' && Object.values(r.n).every(v => v === true)));
}
function saveLog(){
  try { localStorage.setItem(LKEY, JSON.stringify(log)); storeErr = false; return true; }
  catch(e) { storeErr = true; showBook(); $('heard').textContent = '⚠ கணக்கைச் சேமிக்க முடியவில்லை (இடம் / தனிப்பட்ட மோடு)'; return false; }
}
function newRec(){
  cur = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), ts: Date.now(),
         tea: order.tea, coffee: order.coffee, amt: total(), status: 'pending'};
  const x = cfg.items.filter(i => order[i.id]).map(i => ({id:i.id, name:i.name, price:i.price, qty:order[i.id]}));   // பெயர்/விலை அன்றைய நிலை (பின்னர் மாறினாலும் பழைய பதிவு மாறாது)
  if (x.length) cur.x = x;
  if (notes.ls || notes.pc) cur.n = Object.assign({}, notes.ls ? {ls:true} : {}, notes.pc ? {pc:true} : {});
  log.push(cur); saveLog();
}
function setStatus(r, status, method){
  if (r.status === 'received' && status !== 'received') r.fix = {from: r.method, at: Date.now()};   // திருத்தப்பட்டது என்று குறிப்பு
  r.status = status;
  if (status === 'received'){ r.method = method; r.paidAt = Date.now(); } else delete r.method;
  saveLog();
}
const p2 = n => String(n).padStart(2,'0');
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); };
function daySummary(key){
  const recs = log.filter(r => dayKey(r.ts) === key).sort((a,b) => a.ts - b.ts);
  const live = recs.filter(r => r.status !== 'cancelled');
  const sum = f => live.filter(f).reduce((t,r) => t + r.amt, 0);
  return {recs, tea: live.reduce((t,r) => t + r.tea, 0), coffee: live.reduce((t,r) => t + r.coffee, 0),
    sales: sum(() => true), cash: sum(r => r.status === 'received' && r.method === 'cash'),
    upi: sum(r => r.status === 'received' && r.method === 'upi'), pend: live.filter(r => r.status === 'pending'),
    cancelled: recs.length - live.length, fixed: recs.filter(r => r.fix).length,
    ex: live.reduce((m, r) => { (r.x || []).forEach(e => { m[e.name] = (m[e.name] || 0) + e.qty; }); return m; }, {}),
    ls: live.filter(r => r.n && r.n.ls).length, pc: live.filter(r => r.n && r.n.pc).length};
}
const total = (o = order) => KEYS().reduce((t, k) => t + (o[k] || 0) * priceOf(k), 0);

/* ---------- குரல் வெளியீடு & உள்ளீடு ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, listening = false, speaking = false, started = false, speakId = 0;
let restartTimer, ttsTimer, startRetry = 0;
const MKEY = 'voiceTeaMute';
let muted = false;
try { muted = localStorage.getItem(MKEY) === '1'; } catch(e) {}

// மாற்றுகளில் தெளிவில்லாத எண் உள்ளதை, எண் இல்லாத "பொருள் மட்டும்" மாற்று மூலம் தவிர்க்க முடியாது
function pickAlt(alts){
  const an = alts.map(analyze);
  let i = an.findIndex(a => a.unclear || (a.item && a.explicit));  // தெளிவான எண் அல்லது தெளிவில்லா எண் உள்ள முதல் மாற்று
  if (i < 0) i = an.findIndex(a => a.item);
  if (i < 0) i = alts.findIndex(a => isYes(a) || isNo(a) || GREET.test(a) || LS_RE.test(a) || PC_RE.test(a));
  return alts[i < 0 ? 0 : i];
}

// மைக் (மீண்டும்) தொடங்கும் ஒரே இடம்: recognition onend
function onRecEnd(){
  listening = false;
  clearTimeout(restartTimer);
  if (!started || speaking) return;
  restartTimer = setTimeout(() => {
    if (!started || speaking || listening) return;
    try { rec.start(); listening = true; }
    catch(e) {
      if (startRetry++ < 1){ restartTimer = setTimeout(onRecEnd, 500); return; }  // ஒரே ஒரு மறுமுயற்சி
      stopSession(); $('heard').textContent = `மைக் பிழை: ${e.name}`;
    }
  }, 300);
}
function stopSession(){
  started = false; speaking = false; speakId++;
  clearTimeout(restartTimer); clearTimeout(ttsTimer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (rec) rec.abort();
  $('start').textContent = '🎤 தொடங்கு';
  $('heard').textContent = 'மைக் நிறுத்தப்பட்டது';
}
function speak(text){
  if (muted || !window.speechSynthesis) return;   // குரல் பதில் இல்லை: திரையில் மட்டும் காட்டும்; மைக் நிற்காது
  const id = ++speakId;
  speaking = true;               // தன் குரலைத் தானே கேட்காமல் இருக்க
  clearTimeout(restartTimer); clearTimeout(ttsTimer);
  if (rec) rec.abort();
  $('heard').textContent = '🔊 பொறுங்கள்…';
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ta-IN';
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('ta'));
  if (v) u.voice = v;
  const done = () => {
    if (id !== speakId) return;
    speakId++; speaking = false; clearTimeout(ttsTimer);
    if (!listening) onRecEnd();  // abort இன்னும் முடியவில்லை என்றால் onend தானாக வரும்
  };
  u.onend = u.onerror = done;
  // TTS onend வராத போன்களுக்கு: ஒலியை நிறுத்திய பிறகே தொடரும்
  ttsTimer = setTimeout(() => { speechSynthesis.cancel(); done(); }, 2500 + text.length*130);
  speechSynthesis.speak(u);
}
if (SR){
  rec = new SR();
  rec.lang = 'ta-IN';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.onstart = () => { startRetry = 0; if (started && !speaking) $('heard').textContent = '🎤 கேட்கிறது…'; };
  rec.onresult = e => {
    if (!started || speaking) return;
    const alts = Array.from(e.results[e.results.length-1], a => a.transcript);
    // எண்/டீ/காபி/சரி/இல்லை/வணக்கம் பொருந்தும் முதல் மாற்றைத் தேர்ந்தெடு
    handle(pickAlt(alts));
  };
  rec.onend = onRecEnd;
  rec.onerror = e => {
    if (e.error === 'aborted' || e.error === 'no-speech') return;  // மறைக்கப்படும்
    if (['not-allowed','service-not-allowed','audio-capture','language-not-supported','network'].includes(e.error)) stopSession();
    $('heard').textContent = `மைக் பிழை: ${e.error}` +
      (e.error === 'not-allowed' ? ' — HTTPS இணைப்பு மற்றும் Chrome மைக் அனுமதியைச் சரிபார்க்கவும்' : '');
  };
}

/* ---------- திரைகள் ---------- */
function show(s, big, sub){
  state = s;
  clearTimeout(resetTimer);
  $('big').textContent = big;
  $('big').classList.toggle('bill', s === 'confirm');
  $('sub').textContent = sub;
  $('qr').style.display = s === 'pay' ? 'block' : 'none';
  $('note').hidden = !(s === 'pay' || s === 'done');
  $('confirm').hidden = s !== 'confirm';
  $('paid').hidden = s !== 'pay';
  $('cash').hidden = !(s === 'confirm' || s === 'pay');
  $('cancel').hidden = !(s === 'confirm' || s === 'pay');
  $('adds').hidden = s === 'pay' || s === 'done';
  $('chips').hidden = s !== 'confirm';
}
function idle(){
  cur = null;
  order = blank(); notes = {ls:false, pc:false};
  show('idle', 'வணக்கம் 🙏', `"வணக்கம்" சொல்லுங்கள்\n` + KEYS().map(k => `${nameOf(k)} ₹${priceOf(k)}`).join('  •  '));
}
function greet(){
  show('order', 'வணக்கம் 🙏', 'எங்களிடம் டீ மற்றும் காபி உள்ளது.\nஉங்களுக்கு என்ன வேண்டும்?');
  speak('வணக்கம். எங்களிடம் டீ மற்றும் காபி உள்ளது. உங்களுக்கு என்ன வேண்டும்?');
}
const noteTxt = () => [notes.ls ? 'சர்க்கரை குறைவு' : '', notes.pc ? 'பார்சல்' : ''].filter(Boolean);
function showBill(quiet){
  const items = KEYS().filter(k => order[k]);
  const lines = items.map(k => `${order[k]} ${nameOf(k)} × ₹${priceOf(k)} = ₹${order[k]*priceOf(k)}`);
  if (items.length > 1) lines.push(`மொத்தம் ₹${total()}`);
  if (noteTxt().length) lines.push('📝 ' + noteTxt().join(' • '));
  show('confirm', lines.join('\n'), '"சரி" அல்லது "கன்ஃபார்ம்" என்று சொல்லுங்கள்');
  $('nLs').classList.toggle('on', notes.ls); $('nPc').classList.toggle('on', notes.pc);
  if (quiet) return;
  const said = items.map(k => `${order[k]} ${nameOf(k)}`).join(' மற்றும் ');
  speak(`${said}. ` + (noteTxt().length ? noteTxt().join(', ') + '. ' : '') + `மொத்தம் ${total()} ரூபாய். சரி என்று சொல்லுங்கள்.`);
}
function upiLink(amt){
  const q = {pa: cfg.upi.trim(), pn: cfg.name.trim(), am: amt.toFixed(2), cu: 'INR', tn: 'Tea order'};
  return 'upi://pay?' + Object.entries(q)

      if (!x || aliases.includes(x)) continue;
      if (x.length < 2) return {err:`"${name}": சொல்லும் பெயர் குறைந்தது 2 எழுத்து.`};
      if (!x.includes(' ') && BLOCK_W(x)) return {err:`"${x}" என்பது எண் / டீ / காபி / சரி / வேண்டாம் போன்ற சொல்லுடன் குழம்பும்; வேறு பெயர் தரவும்.`};
      if (seen.has(x)) return {err:`"${x}" இரண்டு பொருட்களில் உள்ளது.`};
      seen.add(x); aliases.push(x);
    }
    items.push({id: d.id && /^x[a-z0-9]+$/.test(d.id) ? d.id : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), name, price, aliases});
  }
  return {items};
}
function drawDraft(){
  const box = $('sItems'); box.textContent = '';
  draft.forEach((d, n) => {
    const row = document.createElement('div'); row.className = 'irow';
    [['name','பெயர்','text'],['price','விலை ₹','number'],['say','சொல்லும் பெயர்கள் (, பிரித்து)','text']].forEach(([f, ph, ty]) => {
      const inp = document.createElement('input'); inp.type = ty; inp.placeholder = ph; inp.value = d[f];
      if (f !== 'say') inp.required = true;
      if (f === 'price') inp.min = 1;
      inp.oninput = () => { d[f] = inp.value; };
      row.appendChild(inp);
    });
    const x = document.createElement('button'); x.type = 'button'; x.className = 'alt x'; x.textContent = '✖';
    x.onclick = () => { draft.splice(n, 1); drawDraft(); };
    row.appendChild(x); box.appendChild(row);
  });
}
function openSetup(){
  $('sName').value = cfg.name; $('sUpi').value = cfg.upi;
  $('sTea').value = cfg.tea; $('sCoffee').value = cfg.coffee;
  draft = cfg.items.map(i => ({id:i.id, name:i.name, price:String(i.price), say:i.aliases.join(', ')}));
  $('sErr').textContent = '';
  drawDraft();
  $('setup').hidden = false;
}
$('setup').onsubmit = e => {
  e.preventDefault();
  const v = validateItems(draft);
  if (v.err){ $('sErr').textContent = v.err; return; }
  cfg = {name:$('sName').value.trim(), upi:$('sUpi').value.trim(), tea:+$('sTea').value|0, coffee:+$('sCoffee').value|0, items:v.items};
  try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch(err) {}
  $('shop').textContent = cfg.name;
  buildAdds();
  $('setup').hidden = true;
  idle();
};
$('gear').onclick = openSetup;
document.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => {
  const [name, say] = b.dataset.pre.split('|');
  if (draft.length >= 12) return;
  draft.push({id:'', name, price:'', say});   // விலை நீங்களே உள்ளிட வேண்டும்
  drawDraft();
});
function buildAdds(){
  const box = $('adds'); box.textContent = '';
  KEYS().forEach(k => {
    const b = document.createElement('button'); b.className = 'alt'; b.textContent = '+ ' + nameOf(k);
    b.onclick = () => { order[k] = (order[k] || 0) + 1; showBill(); };
    box.appendChild(b);
  });
}
$('nLs').onclick = () => { notes.ls = !notes.ls; showBill(true); };
$('nPc').onclick = () => { notes.pc = !notes.pc; showBill(true); };
const showMute = () => { $('mute').textContent = muted ? '🔇 குரல் இல்லை' : '🔊 குரல்'; };
$('mute').onclick = () => {
  muted = !muted;
  try { localStorage.setItem(MKEY, muted ? '1' : '0'); } catch(e) {}
  showMute();
  if (muted && window.speechSynthesis){ speechSynthesis.cancel(); }   // பேசிக்கொண்டிருந்தால் நிறுத்தி, மைக் தொடரும்
};
showMute();
$('start').onclick = () => {
  if (started){ stopSession(); $('heard').textContent = 'மைக் நிறுத்தப்பட்டது'; return; }
  if (!rec){ $('heard').textContent = 'இந்த பிரவுசரில் குரல் வசதி இல்லை. Chrome பயன்படுத்தவும்.'; return; }
  started = true; $('start').textContent = '⏹ நிறுத்து';
  $('heard').textContent = '';
  speak('தயார். வணக்கம் சொல்லுங்கள்.');
  if (!speaking) onRecEnd();
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
};

$('confirm').onclick = pay;
$('paid').onclick = () => paid('upi');
$('cash').onclick = () => paid('cash');
$('sCancel').onclick = () => { if (cfg.upi) $('setup').hidden = true; };
$('cancel').onclick = cancel;
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('#hist, main, #adds, #setup'))) e.preventDefault(); }, {passive:false});

/* ---------- கணக்குத் திரை & backup ---------- */
let viewDay = dayKey(Date.now()), fixing = null, nudge = false;
const lastBackup = () => { try { return +localStorage.getItem(BKEY) || 0; } catch(e) { return 0; } };
const lastChange = () => log.reduce((m,r) => Math.max(m, r.ts, r.paidAt || 0, r.fix ? r.fix.at : 0), 0);
// சேமிக்காத மாற்றம் இருந்து, கடைசி backup 24 மணி நேரத்துக்கு மேல் (அல்லது இல்லை)
const backupDue = () => log.length > 0 && lastChange() > lastBackup() && Date.now() - lastBackup() > 864e5;
function showBook(){ $('book').textContent = storeErr ? '📒❗' : backupDue() ? '📒⚠' : '📒'; }
function shiftDay(n){ const [y,m,d] = viewDay.split('-').map(Number); viewDay = dayKey(new Date(y, m-1, d+n).getTime()); renderHist(); }
const exLine = S => Object.keys(S.ex).length ? Object.entries(S.ex).map(([n, q]) => `${n}: ${q}`).join('   ') + '\n' : '';
const noteLine = S => (S.ls || S.pc) ? `சர்க்கரை குறைவு: ${S.ls}   பார்சல்: ${S.pc}\n` : '';
const STXT = r => (r.status === 'received' ? (r.method === 'cash' ? '✔ Cash' : '✔ UPI') : r.status === 'pending' ? '⏳ பணம் பெறவில்லை' : '✖ ரத்து') + (r.fix ? ' (திருத்தியது)' : '');
function renderHist(){
  const S = daySummary(viewDay), today = dayKey(Date.now());
  $('dLbl').textContent = viewDay === today ? 'இன்று ' + viewDay : viewDay;
  $('dNext').disabled = viewDay >= today;
  const rcv = S.cash + S.upi;
  $('sum').textContent =
    `டீ: ${S.tea}   காபி: ${S.coffee}\n` + exLine(S) +
    `மொத்த விற்பனை: ₹${S.sales}\n` +
    `பணம் பெற்றது: ₹${rcv}  (Cash ₹${S.cash} + UPI ₹${S.upi})\n` +
    `பணம் பெறாதது: ₹${S.sales - rcv}` + (S.pend.length ? ` (${S.pend.length} ஆர்டர்)` : '') +
    (S.cancelled ? `\nரத்து: ${S.cancelled}` : '') +
    (S.fixed ? `\nதிருத்தப்பட்டவை: ${S.fixed}` : '') +
    (noteLine(S) ? '\n' + noteLine(S).trim() : '') +
    `\n(கடைக்காரர் அழுத்திய பதிவு மட்டும்; bank சரிபார்ப்பு அல்ல)`;
  const rows = $('rows'); rows.textContent = '';
  S.recs.slice().reverse().forEach(r => {
    const d = new Date(r.ts), div = document.createElement('div'), sp = document.createElement('span');
    div.className = 'row';
    const what = [r.tea ? r.tea + ' டீ' : '', r.coffee ? r.coffee + ' காபி' : '', ...(r.x || []).map(e => e.qty + ' ' + e.name)].filter(Boolean).join(' + ') +
      (r.n ? ' 📝' + [r.n.ls ? 'சர்க்கரை குறைவு' : '', r.n.pc ? 'பார்சல்' : ''].filter(Boolean).join('/') : '');
    sp.textContent = `${p2(d.getHours())}:${p2(d.getMinutes())}  ${what}  ₹${r.amt}  ${STXT(r)}`;
    div.appendChild(sp);
    if (r.status === 'pending') [['Cash','cash'],['UPI','upi']].forEach(([l,m]) => {
      const b = document.createElement('button'); b.className = 'ok'; b.textContent = l + ' ✔';
      b.onclick = () => { setStatus(r, 'received', m); renderHist(); }; div.appendChild(b);
    });
    if (r.status === 'received'){
      const b = document.createElement('button'); b.className = 'alt'; b.textContent = '↩ திருத்து';
      b.onclick = () => { fixing = r.id; renderHist(); }; div.appendChild(b);
      if (fixing === r.id){
        div.className = 'row fixing';
        const q = document.createElement('span'); q.textContent = 'தவறாக அழுத்தினீர்களா? இந்த ₹' + r.amt + ' பதிவை மாற்றவா? (குறிப்புடன் பதிவாகும்)'; div.appendChild(q);
        [['பணம் வரவில்லை ⏳','pending','ok'],['ரத்து ✖','cancelled','alt'],['வேண்டாம்',null,'alt']].forEach(([l,st,cl]) => {
          const x = document.createElement('button'); x.className = cl; x.textContent = l;
          x.onclick = () => { if (st) setStatus(r, st); fixing = null; renderHist(); }; div.appendChild(x);
        });
      }
    }
    if (r.status === 'pending'){
      const b = document.createElement('button'); b.className = 'alt'; b.textContent = '✖';
      b.onclick = () => { setStatus(r, 'cancelled'); renderHist(); }; div.appendChild(b);
    }
    rows.appendChild(div);
  });
  $('bkNote').textContent = backupDue()
    ? '⚠ Backup எடுக்கவும்: ' + (lastBackup() ? 'கடைசி backup ' + dayKey(lastBackup()) : 'இன்னும் எடுக்கவில்லை')
    : (lastBackup() ? 'கடைசி backup: ' + dayKey(lastBackup()) : '') ;
  $('bJson').className = nudge || backupDue() ? 'hot' : '';
  $('bShareBk').hidden = !canShareFile();
  if (nudge) $('bkNote').textContent = '👉 கணக்கைப் பகிர்ந்தாகிவிட்டது. இப்போது Backup-ம் எடுத்து வைக்கவும்.\n' + $('bkNote').textContent;
  if (storeErr) $('bkNote').textContent = '❗ கணக்கைச் சேமிக்க முடியவில்லை; உடனே Backup எடுக்கவும்.\n' + $('bkNote').textContent;
  $('bkNote').textContent += '\nபதிவுகள் இந்த போன் / Chrome-இல் மட்டும் உள்ளன; Chrome data அழிந்தால் போகும். Backup (UPI ID இல்லை) எடுத்து வைக்கவும்.';
  showBook();
}
function openBook(){ nudge = false; fixing = null; viewDay = dayKey(Date.now()); renderHist(); $('hist').hidden = false; }
$('book').onclick = openBook;
$('hClose').onclick = () => { $('hist').hidden = true; nudge = false; fixing = null; };
$('dPrev').onclick = () => shiftDay(-1);
$('dNext').onclick = () => shiftDay(1);
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function noteBackup(){ try { localStorage.setItem(BKEY, String(Date.now())); } catch(e) {} }
$('bJson').onclick = () => {
  download(`voice-tea-backup-${dayKey(Date.now())}.json`, JSON.stringify({app:'voice-tea', v:1, exported:Date.now(), orders:log}), 'application/json');
  noteBackup(); nudge = false; renderHist();
};
$('bCsv').onclick = () => {
  const head = 'date,time,tea,coffee,amount,status,method,extras,notes';
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = log.slice().sort((a,b) => a.ts - b.ts).map(r => { const d = new Date(r.ts);
    return [dayKey(r.ts), p2(d.getHours()) + ':' + p2(d.getMinutes()), r.tea, r.coffee, r.amt, r.status, r.method || '', q((r.x || []).map(e => e.name + ':' + e.qty).join(';')), q(r.n ? Object.keys(r.n).join(';') : '')].join(','); });
  download(`voice-tea-${dayKey(Date.now())}.csv`, [head, ...rows].join('\n'), 'text/csv');
};
function summaryText(key){
  const S = daySummary(key), rcv = S.cash + S.upi;
  return `${cfg.name} - ${key} கணக்கு\n` +
    `டீ: ${S.tea}, காபி: ${S.coffee}\n` + exLine(S) +
    `மொத்த விற்பனை: ₹${S.sales}\n` +
    `பணம் பெற்றது: ₹${rcv} (Cash ₹${S.cash}, UPI ₹${S.upi})\n` +
    `பணம் பெறாதது: ₹${S.sales - rcv}` + (S.pend.length ? ` (${S.pend.length} ஆர்டர்)` : '') +
    (S.cancelled ? `\nரத்து: ${S.cancelled}` : '') + (S.fixed ? `\nதிருத்தப்பட்டவை: ${S.fixed}` : '') + (noteLine(S) ? '\n' + noteLine(S).trim() : '') +
    `\n(கடைக்காரர் பதிவு; bank சரிபார்ப்பு அல்ல)`;
}
const backupJson = () => JSON.stringify({app:'voice-tea', v:1, exported:Date.now(), orders:log});
function canShareFile(){
  try { return !!(navigator.canShare && typeof File === 'function' && navigator.canShare({files:[new File(['{}'], 'b.json', {type:'application/json'})]})); }
  catch(e) { return false; }
}
$('bShare').onclick = async () => {
  const text = summaryText(viewDay);
  try {
    if (navigator.share) await navigator.share({text});
    else if (navigator.clipboard) { await navigator.clipboard.writeText(text); $('bkNote').textContent = 'கணக்கு copy ஆனது; WhatsApp-ல் paste செய்யவும்.'; }
    else { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); }
  } catch(e) { if (e && e.name === 'AbortError') return; $('bkNote').textContent = '⚠ பகிர முடியவில்லை.'; return; }   // பயனர் மூடினால் எதுவும் செய்யாது
  nudge = true; renderHist();
};
$('bShareBk').onclick = async () => {
  try {
    const f = new File([backupJson()], `voice-tea-backup-${dayKey(Date.now())}.json`, {type:'application/json'});
    await navigator.share({files:[f]});
    noteBackup(); nudge = false; renderHist();
  } catch(e) { if (!(e && e.name === 'AbortError')) $('bkNote').textContent = '⚠ Backup பகிர முடியவில்லை; ⬇ Backup (JSON) பயன்படுத்தவும்.'; }
};
$('bRestore').onclick = () => $('bFile').click();
$('bFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if (!j || j.app !== 'voice-tea' || !Array.isArray(j.orders)) throw 0;
      const have = new Set(log.map(r => r.id));
      const add = j.orders.filter(r => okRec(r) && !have.has(r.id));
      const bad = j.orders.length - j.orders.filter(okRec).length;
      log = log.concat(add); saveLog(); renderHist();
      $('bkNote').textContent = `Restore: ${add.length} புதிய பதிவுகள் சேர்க்கப்பட்டன` + (bad ? `, ${bad} தவறானவை தவிர்க்கப்பட்டன` : '') + '.\n' + $('bkNote').textContent;
    } catch(err) { $('bkNote').textContent = '⚠ இது சரியான backup கோப்பு அல்ல; எதுவும் மாற்றப்படவில்லை.'; }
  };
  fr.onerror = () => { $('bkNote').textContent = '⚠ கோப்பைப் படிக்க முடியவில்லை.'; };
  fr.readAsText(f);
};
showBook();

$('shop').textContent = cfg.name;
buildAdds();
idle();
if (!cfg.upi) openSetup();
</script>
