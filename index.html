<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>குரல் டீ ஆர்டர்</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:system-ui,"Noto Sans Tamil",sans-serif;background:#3b1f10;color:#fff8ec;text-align:center}
#app{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;padding-bottom:20px!important;display:flex;flex-direction:column;padding:12px;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:700}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;overflow:hidden}
#big{font-size:min(12vw,9vh);font-weight:800;line-height:1.35;color:#ffd166;white-space:pre-line}
#big.bill{font-size:min(6.4vw,5vh);line-height:1.6}
#sub{font-size:min(5.5vw,3.5vh);white-space:pre-line}
#qr{display:none;background:#fff;padding:12px;border-radius:12px}
#qr img,#qr canvas{width:min(78vw,34vh)!important;height:min(78vw,34vh)!important}
#note{font-size:13px;opacity:.85}
#heard{min-height:1.4em;opacity:.7;font-size:14px}
footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:12px;padding:11px 14px;font:700 17px inherit;background:#ffd166;color:#3b1f10}
button.alt{background:#6b4330;color:#fff}
.hbtns{display:flex;gap:8px}
#mute{font-size:14px}
button.ok{background:#2e9e55;color:#fff}
[hidden]{display:none!important}
#setup{position:fixed;inset:0;background:#3b1f10;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px}
#setup input{padding:10px;border-radius:8px;border:0;font-size:16px;width:100%}
#setup label{text-align:left;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header><span id="shop"></span><span class="hbtns"><button class="alt" id="mute" aria-label="குரல் பதில்">🔊 குரல்</button><button class="alt" id="gear" aria-label="அமைப்புகள்">⚙️</button></span></header>
  <main>
    <div id="big"></div>
    <div id="qr"></div>
    <div id="sub"></div>
    <div id="note" hidden>"பணம் வந்தது ✔" என்பது கடைக்காரரின் உறுதிப்படுத்தல் மட்டுமே; bank verification அல்ல.</div>
  </main>
  <div id="heard"></div>
  <footer>
    <button id="start">🎤 தொடங்கு</button>
    <button class="alt" data-add="tea">+ டீ</button>
    <button class="alt" data-add="coffee">+ காபி</button>
    <button class="ok" id="confirm" hidden>✔ உறுதி</button>
    <button class="ok" id="paid" hidden>கடைக்காரர்: பணம் வந்தது ✔</button>
    <button class="alt" id="cancel" hidden>✖ ரத்து</button>
  </footer>
</div>

<form id="setup" hidden>
  <h2>கடை அமைப்புகள்</h2>
  <label>கடை பெயர்<input id="sName" required></label>
  <label>UPI ID<input id="sUpi" required placeholder="name@bank" pattern="[A-Za-z0-9._\-]+@[A-Za-z0-9.\-]+" autocapitalize="off"></label>
  <label>டீ விலை ₹<input id="sTea" type="number" min="1" required></label>
  <label>காபி விலை ₹<input id="sCoffee" type="number" min="1" required></label>
  <button>சேமி</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'voiceTeaCfg';
const NAMES = {tea:'டீ', coffee:'காபி'};
let cfg = {name:'எங்கள் டீ கடை', upi:'', tea:15, coffee:20};
try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}

let state = 'idle', order = {tea:0, coffee:0}, resetTimer;
const total = () => order.tea*cfg.tea + order.coffee*cfg.coffee;

/* ---------- குரல் வெளியீடு & உள்ளீடு ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, listening = false, speaking = false, started = false, speakId = 0;
let restartTimer, ttsTimer, startRetry = 0;
const MKEY = 'voiceTeaMute';
let muted = false;
try { muted = localStorage.getItem(MKEY) === '1'; } catch(e) {}

// மாற்றுகளில் தெளிவில்லாத எண் உள்ளதை, எண் இல்லாத "பொருள் மட்டும்" மாற்று மூலம் தவிர்க்க முடியாது
function pickAlt(alts){
  const an = alts.map(analyze);
  let i = an.findIndex(a => a.unclear || (a.item && a.explicit));  // தெளிவான எண் அல்லது தெளிவில்லா எண் உள்ள முதல் மாற்று
  if (i < 0) i = an.findIndex(a => a.item);
  if (i < 0) i = alts.findIndex(a => isYes(a) || isNo(a) || GREET.test(a));
  return alts[i < 0 ? 0 : i];
}

// மைக் (மீண்டும்) தொடங்கும் ஒரே இடம்: recognition onend
function onRecEnd(){
  listening = false;
  clearTimeout(restartTimer);
  if (!started || speaking) return;
  restartTimer = setTimeout(() => {
    if (!started || speaking || listening) return;
    try { rec.start(); listening = true; }
    catch(e) {
      if (startRetry++ < 1){ restartTimer = setTimeout(onRecEnd, 500); return; }  // ஒரே ஒரு மறுமுயற்சி
      stopSession(); $('heard').textContent = `மைக் பிழை: ${e.name}`;
    }
  }, 300);
}
function stopSession(){
  started = false; speaking = false; speakId++;
  clearTimeout(restartTimer); clearTimeout(ttsTimer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (rec) rec.abort();
  $('start').textContent = '🎤 தொடங்கு';
  $('heard').textContent = 'மைக் நிறுத்தப்பட்டது';
}
function speak(text){
  if (muted || !window.speechSynthesis) return;   // குரல் பதில் இல்லை: திரையில் மட்டும் காட்டும்; மைக் நிற்காது
  const id = ++speakId;
  speaking = true;               // தன் குரலைத் தானே கேட்காமல் இருக்க
  clearTimeout(restartTimer); clearTimeout(ttsTimer);
  if (rec) rec.abort();
  $('heard').textContent = '🔊 பொறுங்கள்…';
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ta-IN';
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('ta'));
  if (v) u.voice = v;
  const done = () => {
    if (id !== speakId) return;
    speakId++; speaking = false; clearTimeout(ttsTimer);
    if (!listening) onRecEnd();  // abort இன்னும் முடியவில்லை என்றால் onend தானாக வரும்
  };
  u.onend = u.onerror = done;
  // TTS onend வராத போன்களுக்கு: ஒலியை நிறுத்திய பிறகே தொடரும்
  ttsTimer = setTimeout(() => { speechSynthesis.cancel(); done(); }, 2500 + text.length*130);
  speechSynthesis.speak(u);
}
if (SR){
  rec = new SR();
  rec.lang = 'ta-IN';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.onstart = () => { startRetry = 0; if (started && !speaking) $('heard').textContent = '🎤 கேட்கிறது…'; };
  rec.onresult = e => {
    if (!started || speaking) return;
    const alts = Array.from(e.results[e.results.length-1], a => a.transcript);
    // எண்/டீ/காபி/சரி/இல்லை/வணக்கம் பொருந்தும் முதல் மாற்றைத் தேர்ந்தெடு
    handle(pickAlt(alts));
  };
  rec.onend = onRecEnd;
  rec.onerror = e => {
    if (e.error === 'aborted' || e.error === 'no-speech') return;  // மறைக்கப்படும்
    if (['not-allowed','service-not-allowed','audio-capture','language-not-supported','network'].includes(e.error)) stopSession();
    $('heard').textContent = `மைக் பிழை: ${e.error}` +
      (e.error === 'not-allowed' ? ' — HTTPS இணைப்பு மற்றும் Chrome மைக் அனுமதியைச் சரிபார்க்கவும்' : '');
  };
}

/* ---------- திரைகள் ---------- */
function show(s, big, sub){
  state = s;
  clearTimeout(resetTimer);
  $('big').textContent = big;
  $('big').classList.toggle('bill', s === 'confirm');
  $('sub').textContent = sub;
  $('qr').style.display = s === 'pay' ? 'block' : 'none';
  $('note').hidden = !(s === 'pay' || s === 'done');
  $('confirm').hidden = s !== 'confirm';
  $('paid').hidden = s !== 'pay';
  $('cancel').hidden = !(s === 'confirm' || s === 'pay');
  document.querySelectorAll('[data-add]').forEach(b => b.hidden = s === 'pay' || s === 'done');
}
function idle(){
  order = {tea:0, coffee:0};
  show('idle', 'வணக்கம் 🙏', `"வணக்கம்" சொல்லுங்கள்\nடீ ₹${cfg.tea}  •  காபி ₹${cfg.coffee}`);
}
function greet(){
  show('order', 'வணக்கம் 🙏', 'எங்களிடம் டீ மற்றும் காபி உள்ளது.\nஉங்களுக்கு என்ன வேண்டும்?');
  speak('வணக்கம். எங்களிடம் டீ மற்றும் காபி உள்ளது. உங்களுக்கு என்ன வேண்டும்?');
}
function showBill(){
  const items = Object.keys(order).filter(k => order[k]);
  const lines = items.map(k => `${order[k]} ${NAMES[k]} × ₹${cfg[k]} = ₹${order[k]*cfg[k]}`);
  if (items.length > 1) lines.push(`மொத்தம் ₹${total()}`);
  show('confirm', lines.join('\n'), '"சரி" அல்லது "கன்ஃபார்ம்" என்று சொல்லுங்கள்');
  const said = items.map(k => `${order[k]} ${NAMES[k]}`).join(' மற்றும் ');
  speak(`${said}. மொத்தம் ${total()} ரூபாய். சரி என்று சொல்லுங்கள்.`);
}
function upiLink(amt){
  const q = {pa: cfg.upi.trim(), pn: cfg.name.trim(), am: amt.toFixed(2), cu: 'INR', tn: 'Tea order'};
  return 'upi://pay?' + Object.entries(q)
    .map(([k,v]) => `${k}=${encodeURIComponent(v).replace(/%40/g,'@')}`).join('&');
}
function pay(){
  if (!cfg.upi) return openSetup();
  if (!window.QRCode){
    $('sub').textContent = 'QR ஏற்றப்படவில்லை. இணையத்தைச் சரிபார்க்கவும்.';
    return;
  }
  const amt = total();
  $('qr').innerHTML = '';
  new QRCode($('qr'), {
    text: upiLink(amt),
    width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M
  });
  show('pay', `₹${amt}`, 'QR ஸ்கேன் செய்து பணம் செலுத்துங்கள்');
  speak(`${amt} ரூபாய். கியூ ஆர் கோடை ஸ்கேன் செய்து பணம் செலுத்துங்கள்.`);
}
// கடைக்காரர் தன் UPI ஆப் / சவுண்ட் பாக்ஸில் பணம் வந்ததைப் பார்த்த பிறகே அழுத்த வேண்டும்
function paid(){
  show('done', '✅\nஉங்கள் பேமெண்ட் கன்ஃபார்ம் ஆகிவிட்டது', 'நன்றி 🙏');
  speak('உங்கள் பேமெண்ட் கன்ஃபார்ம் ஆகிவிட்டது. நன்றி.');
  resetTimer = setTimeout(idle, 8000);
}
function cancel(){ idle(); speak('ஆர்டர் ரத்து செய்யப்பட்டது.'); }

/* ---------- பேச்சைப் புரிந்துகொள்ளுதல் ---------- */
const isYes = t => /சரி|ச ரி|ஓகே|ஓக்கே|ஆமா|^\s*ஆம்|உறுதி|கன்ஃ?[பப]|கன்ஃபர்|confirm|conform|\bok(ay)?\b|\byes\b|\bsari\b/i.test(t);
const isNo = t => /வேண்டாம்|வேணாம்|இல்ல|ரத்து|கேன்சல்|cancel|\bno\b/i.test(t);
const GREET = /வணக்கம்|vanakkam|ஹலோ|hello/i;
const NUMRE = () => NUMS.flatMap(n => n[1]).filter(w => /[^\x00-\x7f]/.test(w)).sort((x, y) => y.length - x.length).join('|');
let _numRe; // "இரண்டுடீ", "2டீ" போல ஒட்டிய சொற்களைப் பிரிக்கும்
const words = text => {
  _numRe = _numRe || new RegExp('(' + NUMRE() + ')(?=டீ|டி|காபி|காப்பி|காஃபி)', 'g');
  return text.toLowerCase().replace(/(\d+)/g, ' $1 ').replace(/[.,!?]/g, ' ').replace(_numRe, '$1 ').split(/\s+/).filter(Boolean);
};
const hasItem = t => { const o = parseOrder(words(TAMIL_DIGITS(t.toLowerCase()))); return o.tea || o.coffee; };
const NUMS = [
  [1,['இன்னொரு','ஒரு','ஒன்று','ஒன்னு','ஒண்ணு','one','a']],
  [2,['இரண்டு','ரெண்டு','இரெண்டு','two']],
  [3,['மூன்று','மூணு','மூனு','three']],
  [4,['நான்கு','நாலு','four']],
  [5,['ஐந்து','அஞ்சு','five']],
  [6,['ஆறு','six']],
  [7,['ஏழு','seven']],
  [8,['எட்டு','eight']],
  [9,['ஒன்பது','ஒம்பது','nine']],
  [10,['பத்து','ten']],
  [11,['பதினொன்று','பதினொன்னு','பதினொண்ணு','eleven']],
  [12,['பன்னிரண்டு','பன்னெண்டு','பன்னிரெண்டு','twelve']],
  [13,['பதிமூன்று','பதின்மூன்று','பதிமூணு','thirteen']],
  [14,['பதினான்கு','பதினாலு','fourteen']],
  [15,['பதினைந்து','பதினஞ்சு','பதினைஞ்சு','fifteen']],
  [16,['பதினாறு','sixteen']],
  [17,['பதினேழு','seventeen']],
  [18,['பதினெட்டு','eighteen']],
  [19,['பத்தொன்பது','பத்தொம்பது','nineteen']],
  [20,['இருபது','இருவது','twenty']],
  [25,['இருபத்தைந்து','இருபத்தஞ்சு','இருவத்தஞ்சு','இருவத்தைந்து']],
  [30,['முப்பது','thirty']],
  [40,['நாற்பது','நாப்பது','forty']],
  [50,['ஐம்பது','அம்பது','fifty']],
  [60,['அறுபது','sixty']], [70,['எழுபது','seventy']], [80,['எண்பது','eighty']], [90,['தொண்ணூறு','ninety']],
  [100,['நூறு','hundred']], [200,['இருநூறு']], [300,['முன்னூறு']], [400,['நானூறு']], [500,['ஐநூறு','ஐந்நூறு']],
  [600,['அறுநூறு']], [700,['எழுநூறு']], [800,['எண்ணூறு']], [900,['தொள்ளாயிரம்']], [1000,['ஆயிரம்','thousand']]
];
// தெளிவில்லாத எண்கள்: எதிர்மறை, 0, தசமம், பின்னம், ஆதரிக்காத பெரிய/கூட்டு வடிவங்கள்
const UNCLEAR_RE = /(^|[^\d.,])[-−–+]\s*\d|\d\s*[.,/]\s*\d|(^|\D)0+(?=\D|$)|பூஜ்ஜிய|பூஜ்ய|சுழி|zero|minus|negative|மைனஸ்|அரை|ஒன்றரை|இரண்டரை|மூன்றரை|நான்கரை|ஐந்தரை|ஆறரை|ஏழரை|எட்டரை|ஒன்பதரை|பத்தரை|கால்|முக்கால்|half|quarter|லட்சம்|இலட்சம்|கோடி|lakh|million|crore|நூற்று|நூற்றி|நூறாயிர|ஆயிரத்து|ஆயிரத்தி|[௦-௯]+\s*[.,/]/i;
const TAMIL_DIGITS = t => t.replace(/[௦-௯]/g, c => c.charCodeAt(0) - 0x0BE6);
const numOf = w => /^\d+$/.test(w) ? +w : (NUMS.find(n => n[1].includes(w)) || [0])[0];
const itemOf = w => /^(டீ|டி$|டியு|டிகள்|தேநீர்|tea|tee$|ti$)/.test(w) ? 'tea' : /^(காபி|காப்பி|காஃபி|கோபி|coffee)/.test(w) ? 'coffee' : null;

// எண் பொருளுக்கு முன் ("2 டீ 1 காபி") அல்லது பின் ("டீ 2 காபி 1") வரலாம்; எண் இல்லையெனில் 1
function parseDetail(words){
  const found = {tea:0, coffee:0};
  const items = [], nums = [];
  words.forEach((w, i) => {
    const it = itemOf(w);
    if (it){ items.push([i, it]); return; }
    const n = numOf(w); if (!n) return;
    const last = nums[nums.length-1];
    // "இருபது ஐந்து" = 25, "நூறு ஐம்பது" = 150 (சொல் வடிவ எண்கள் அடுத்தடுத்து வந்தால் மட்டும்)
    if (last && last[0] === i-1 && !/^\d+$/.test(w) && !/^\d+$/.test(words[i-1]) && last[1] % 10 === 0 && last[1] >= 20 && n < (last[1] >= 100 ? 100 : 10) && n % 100 !== 0) { last[0] = i; last[1] += n; return; }
    nums.push([i, n]);
  });
  if (!items.length) return {found, explicit:false};
  const after = nums.length && items[0][0] < nums[0][0];
  let explicit = true;
  items.forEach(([i, it], k) => {
    const prevItem = k ? items[k-1][0] : -1, nextItem = k+1 < items.length ? items[k+1][0] : words.length;
    let q = 0;
    if (after) { const m = nums.find(([j]) => j > i && j < nextItem); if (m) q = m[1]; }
    else { const m = nums.filter(([j]) => j < i && j > prevItem).pop(); if (m) q = m[1]; }
    if (!q) explicit = false;
    found[it] += q || 1;
  });
  return {found, explicit};
}
const parseOrder = words => parseDetail(words).found;
// ஒரு வாக்கியத்தை மதிப்பிடு: unclear = பொருள் இருக்க, எண் தெளிவில்லை
function analyze(text){
  const raw = TAMIL_DIGITS(text.toLowerCase());
  const d = parseDetail(words(raw));
  const item = d.found.tea || d.found.coffee;
  return {item, found:d.found, explicit:d.explicit, unclear: !!item && UNCLEAR_RE.test(raw)};
}

function askQty(msg){            // cart/நிலையை மாற்றாமல் மீண்டும் கேட்கும்
  speak('எண்ணிக்கையை மீண்டும் சொல்லுங்கள்.');
  $('heard').textContent = '❓ ' + msg;
}
function handle(text){
  $('heard').textContent = '🗣 ' + text;
  const t = TAMIL_DIGITS(text.toLowerCase()).replace(/(\d+)/g, ' $1 ').replace(/[.,!?]/g, ' ');
  const w = words(text);
  const has = list => w.some(x => list.includes(x));
  const no = has(['வேண்டாம்','வேணாம்','இல்லை','இல்ல','ரத்து','cancel','கேன்சல்','no']);
  const A = analyze(text), o = A.found;
  const gotItem = A.item;

  if (state === 'pay'){ if (no) cancel(); return; }       // பணம் வந்ததைக் குரலால் உறுதி செய்ய முடியாது
  if (gotItem && A.unclear && !no) return askQty('எண்ணிக்கை தெளிவில்லை: "' + text + '"');
  if (state === 'done' && !gotItem) return;               // நன்றி சொல்லும் நேரம்; புது order இருந்தால் எடுக்கும்
  if (state === 'idle' && !gotItem){ if (GREET.test(t)) greet(); return; }
  if (no && !gotItem) return state === 'idle' ? undefined : cancel();
  if (no) return cancel();

  if (gotItem){
    const add = has(['இன்னும்','இன்னொரு','கூட','சேர்த்து','சேர்','also','more']) || w.includes('இன்னொன்னு');
    const base = (state === 'order' || state === 'confirm') ? order : {tea:0, coffee:0};
    const next = add ? {tea: base.tea + o.tea, coffee: base.coffee + o.coffee} : o;
    const amt = next.tea*cfg.tea + next.coffee*cfg.coffee;
    if (![next.tea, next.coffee, amt].every(Number.isSafeInteger))   // கணக்கிட முடியாத பெரிய எண் மட்டும்
      return askQty('எண்ணிக்கை சரியில்லை');
    order = next;
    return showBill();
  }
  if (state === 'confirm' && isYes(t)) return pay();
  if (GREET.test(t)) return greet();
}

/* ---------- பொத்தான்கள் & அமைப்புகள் ---------- */
function openSetup(){
  $('sName').value = cfg.name; $('sUpi').value = cfg.upi;
  $('sTea').value = cfg.tea; $('sCoffee').value = cfg.coffee;
  $('setup').hidden = false;
}
$('setup').onsubmit = e => {
  e.preventDefault();
  cfg = {name:$('sName').value.trim(), upi:$('sUpi').value.trim(), tea:+$('sTea').value|0, coffee:+$('sCoffee').value|0};
  try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch(err) {}
  $('shop').textContent = cfg.name;
  $('setup').hidden = true;
  idle();
};
$('gear').onclick = openSetup;
const showMute = () => { $('mute').textContent = muted ? '🔇 குரல் இல்லை' : '🔊 குரல்'; };
$('mute').onclick = () => {
  muted = !muted;
  try { localStorage.setItem(MKEY, muted ? '1' : '0'); } catch(e) {}
  showMute();
  if (muted && window.speechSynthesis){ speechSynthesis.cancel(); }   // பேசிக்கொண்டிருந்தால் நிறுத்தி, மைக் தொடரும்
};
showMute();
$('start').onclick = () => {
  if (started){ stopSession(); $('heard').textContent = 'மைக் நிறுத்தப்பட்டது'; return; }
  if (!rec){ $('heard').textContent = 'இந்த பிரவுசரில் குரல் வசதி இல்லை. Chrome பயன்படுத்தவும்.'; return; }
  started = true; $('start').textContent = '⏹ நிறுத்து';
  $('heard').textContent = '';
  speak('தயார். வணக்கம் சொல்லுங்கள்.');
  if (!speaking) onRecEnd();
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
};
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { order[b.dataset.add]++; showBill(); });
$('confirm').onclick = pay;
$('paid').onclick = paid;
$('cancel').onclick = cancel;
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

$('shop').textContent = cfg.name;
idle();
if (!cfg.upi) openSetup();
</script>
